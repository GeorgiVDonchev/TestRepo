# Server Configuration
server.port=8080
spring.application.name=crypto-trading-bot

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/crypto_trading_bot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Database (for development/testing)
# Uncomment below and comment MySQL to use H2
# spring.datasource.url=jdbc:h2:mem:cryptobot
# spring.datasource.driver-class-name=org.h2.Driver
# spring.h2.console.enabled=true

# CORS Configuration
cors.allowed.origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173

# Bot Configuration
bot.trading.interval=60000
bot.api.coingecko.url=https://api.coingecko.com/api/v3

# Logging
logging.level.com.cryptobot=INFO
logging.level.org.springframework.web=INFO
