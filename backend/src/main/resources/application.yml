server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tradingbot}?stringtype=unspecified
    username: ${DB_USER:tradingbot}
    password: ${DB_PASSWORD:tradingbot}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

logging:
  level:
    root: INFO
    com.example.tradingbot: DEBUG

app:
  trading:
    initialCash: 10000.00
    feeRateBps: 10 # 0.10% fee
    livePollSeconds: 20
    defaultSymbol: BTCUSDT
    defaultInterval: 1m
